<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCOFTI 500</title>
</head>
<body data-screen="title">
  <div class="welcome"></div>

  <section id="title-screen" class="screen">
    <h1 class="title"><span class="mark">SCOFTI</span><span class="five" data-t="500"><span class="fill">500</span></span></h1>
    <a id="to-arcade" href="/arcade/" aria-label="Back to the arcade">✕</a>
    <button id="race-now" class="go-btn" type="button">RACE NOW</button>
  </section>

  <section id="driver-screen" class="screen pick-screen">
    <div class="pick-top">
      <button class="back-btn" type="button" data-back>◀ BACK</button>
      <h2 class="pick-title">PICK YOUR DRIVER</h2>
    </div>
    <div class="pick-stage">
      <img id="driver-img" class="hero-img" alt="" />
      <div class="pick-info">
        <span id="driver-role" class="pick-role"></span>
        <h3 id="driver-name" class="pick-name"></h3>
        <span id="driver-sub" class="pick-sub"></span>
        <p id="driver-line" class="pick-line"></p>
        <button id="driver-go" class="go-btn" type="button">NEXT ▶</button>
      </div>
    </div>
    <div id="driver-cards" class="pick-cards"></div>
  </section>

  <section id="car-screen" class="screen pick-screen">
    <div class="pick-top">
      <button class="back-btn" type="button" data-back>◀ BACK</button>
      <h2 class="pick-title">PICK YOUR CAR</h2>
    </div>
    <div class="pick-stage">
      <div class="hero-box">
        <img id="car-img" class="hero-img" alt="" title="Tap to turn the car" />
        <div class="view-row"><span class="turn-hint">↻ tap to turn</span><span id="car-views" class="view-dots"></span></div>
      </div>
      <div class="pick-info">
        <span id="car-role" class="pick-role"></span>
        <h3 id="car-name" class="pick-name"></h3>
        <span id="car-sub" class="pick-sub"></span>
        <p id="car-line" class="pick-line"></p>
        <div class="paints-wrap">
          <span id="paint-name" class="paint-name"></span>
          <div id="car-paints" class="paints"></div>
        </div>
        <button id="car-go" class="go-btn go-long" type="button">TO THE PIT GARAGE ▶</button>
      </div>
    </div>
    <div id="car-cards" class="pick-cards"></div>
  </section>

  <section id="garage-screen" class="screen">
    <p class="race-flag">PIT GARAGE</p>
    <img id="garage-car" class="garage-car" alt="" />
    <span id="race-who"></span>
    <p class="race-soon">The crew will tune your car here. Coming soon.</p>
    <button id="garage-go" class="go-btn go-long" type="button">PICK YOUR TRACK ▶</button>
    <button class="back-btn" type="button" data-back>◀ BACK</button>
  </section>

  <section id="track-screen" class="screen">
    <p class="race-flag">PICK YOUR TRACK</p>
    <p id="track-name" class="track-name"></p>
    <span id="track-kind" class="pick-role"></span>
    <p id="track-line" class="race-soon"></p>
    <p class="race-soon">The race itself is coming next.</p>
    <button class="back-btn" type="button" data-back>◀ BACK</button>
  </section>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
