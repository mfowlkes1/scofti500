<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCOFTI 500</title>
</head>
<body data-screen="title">
  <div class="welcome"></div>

  <section id="title-screen" class="screen">
    <h1 class="title"><span class="mark">SCOFTI</span><span class="five" data-t="500"><span class="fill">500</span></span></h1>
    <a id="to-arcade" href="/arcade/" aria-label="Back to the arcade">✕</a>
    <button id="race-now" class="go-btn" type="button">RACE NOW</button>
  </section>

  <section id="pick-screen" class="screen">
    <div class="pick-top">
      <button id="pick-back" class="back-btn" type="button">◀ BACK</button>
      <h2 class="pick-title">PICK YOUR DRIVER</h2>
    </div>
    <div class="pick-stage">
      <div class="hero-wrap">
        <div id="pick-hero" class="door"><span id="pick-num" class="num"></span></div>
        <img id="pick-face" class="hero-face" alt="" />
      </div>
      <div class="pick-info">
        <span id="pick-role" class="pick-role"></span>
        <h3 id="pick-name" class="pick-name"></h3>
        <span id="pick-team" class="pick-team"></span>
        <p id="pick-line" class="pick-line"></p>
        <button id="pick-go" class="go-btn" type="button">RACE!</button>
      </div>
    </div>
    <div id="pick-cards" class="pick-cards"></div>
  </section>

  <section id="race-screen" class="screen">
    <p class="race-flag">GREEN FLAG</p>
    <span id="race-who"></span>
    <p class="race-soon">The race isn't built yet.</p>
    <button id="race-back" class="back-btn" type="button">◀ BACK</button>
  </section>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
